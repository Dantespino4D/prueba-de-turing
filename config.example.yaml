# ============================================================
# Prueba de Turing — Configuración de ejemplo
# Copia este archivo a config.yaml y ajusta los valores.
# config.yaml está en .gitignore (contiene contraseñas).
# ============================================================

# --- Aplicación ---
app:
  host: "0.0.0.0"
  port: 8100
  # Ruta secreta del panel del cómplice (no enlazada desde ningún lado)
  panel_path: "/panel-secreto"
  # Contraseña del panel (una sola, compartida)
  panel_password: "cambia-esto-por-algo-seguro"
  # Clave secreta para firmar cookies de sesión (genera con: python -c "import secrets; print(secrets.token_hex(32))")
  secret_key: "cambia-esta-clave-secreta-tambien"

# --- Sesión ---
session:
  # Duración de la sesión en segundos (300 = 5 minutos)
  duration_seconds: 300

# --- Servidor RKLLM ---
# El servidor Flask (flask_server.py) corre en el host en el puerto 8080 por defecto.
# Desde el contenedor Podman usa "http://host.containers.internal:8080".
# Desde el host directamente usa "http://localhost:8080".
# IMPORTANTE: el servidor carga un solo modelo al arrancar. Para cambiar de modelo
# hay que reiniciar el servicio (sudo systemctl restart rkllm-server).
rkllm:
  base_url: "http://host.containers.internal:8080"
  # Timeout de inferencia en segundos. El modelo puede tardar 30-40 s en responder
  # dependiendo del modelo y la longitud de la respuesta.
  timeout_seconds: 40
  # Parámetros de generación (se pasan directamente a flask_server.py)
  max_tokens: 200
  temperature: 0.8
  top_p: 0.9
  top_k: 1
  repeat_penalty: 1.1

# --- Mock RKLLM (solo para desarrollo) ---
mock:
  enabled: false          # true para desarrollo sin NPU; false para usar el RKLLM real
  port: 8080
  min_latency_seconds: 3  # Latencia mínima simulada
  max_latency_seconds: 10 # Latencia máxima simulada

# --- Tiempos simulados de escritura humana ---
timing:
  # Pausa de "lectura" antes de mostrar "escribiendo..." (segundos)
  read_delay_min: 1.0
  read_delay_max: 3.0
  # Velocidad de escritura simulada (caracteres por segundo)
  typing_speed_min: 4.0
  typing_speed_max: 6.0
  # Tiempo mínimo total antes de entregar respuesta del humano (segundos)
  human_min_total: 5.0
  # Tiempo máximo de espera de respuesta del humano (segundos)
  human_max_wait: 30.0

# --- Historial ---
history:
  output_dir: "/mnt/disco_8TB/historial-turing"

# --- Webhook opcional (n8n) ---
webhook:
  enabled: false
  url: "https://n8n.example.com/webhook/turing-session"
